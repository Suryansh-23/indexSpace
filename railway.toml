[build]
builder = "DOCKERFILE"
dockerfilePath = "indexspace/backend/Dockerfile"
watchPatterns = [
  "/package.json",
  "/bun.lock",
  "/scripts/**",
  "/indexspace/backend/**",
  "/indexspace/shared/**"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false
